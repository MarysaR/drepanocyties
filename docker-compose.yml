# Infrastructure locale : PostgreSQL uniquement (l'application tourne avec `pnpm dev`).
# Trois bases distinctes : `twin` (développement, vierge), `twin_test` (intégration), `twin_e2e` (Playwright).
services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: twin
      POSTGRES_PASSWORD: twin_local_password
      POSTGRES_DB: twin
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twin -d twin"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
